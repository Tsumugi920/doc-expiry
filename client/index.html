<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doc-expiry · 证件到期管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🗂️</span>
      <div>
        <h1>doc-expiry 证件到期管理</h1>
        <p>身份证 / 护照 / 驾照 / 会员卡 / 保险 · 到期提醒与续办跟踪</p>
      </div>
    </div>
    <div id="headerSummary" class="header-summary" aria-live="polite"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="docs">🪪 证件列表</button>
    <button class="tab" data-tab="reminders">⏰ 到期提醒<span id="reminderBadge" class="badge hidden"></span></button>
    <button class="tab" data-tab="renewals">🔁 续办记录</button>
    <button class="tab" data-tab="stats">📊 分类统计</button>
  </nav>

  <main class="container">
    <!-- 证件列表 -->
    <section id="tab-docs" class="tab-panel active">
      <div class="panel-head">
        <h2>证件列表</h2>
        <button id="btnAddDoc" class="btn primary">＋ 新增证件</button>
      </div>
      <div class="filters">
        <select id="filterType">
          <option value="all">全部类型</option>
          <option>身份证</option>
          <option>护照</option>
          <option>驾照</option>
          <option>会员卡</option>
          <option>保险</option>
        </select>
        <select id="filterStatus">
          <option value="all">全部状态</option>
          <option value="expired">已过期</option>
          <option value="critical">7 天内到期</option>
          <option value="warning">30 天内到期</option>
          <option value="ok">正常</option>
        </select>
        <input id="searchKeyword" type="search" placeholder="搜索名称 / 持有人 / 证件号码…" />
      </div>
      <div class="table-wrap">
        <table id="docsTable">
          <thead>
            <tr>
              <th>证件</th><th>持有人</th><th>证件号码</th><th>签发日期</th>
              <th>到期日期</th><th>状态</th><th class="th-actions">操作</th>
            </tr>
          </thead>
          <tbody id="docsTbody"></tbody>
        </table>
        <div id="docsEmpty" class="empty hidden">没有符合条件的证件</div>
      </div>
    </section>

    <!-- 到期提醒 -->
    <section id="tab-reminders" class="tab-panel">
      <div class="panel-head">
        <h2>到期提醒</h2>
        <div class="segmented" id="reminderSeg">
          <button class="seg active" data-days="30">30 天内</button>
          <button class="seg" data-days="7">7 天内</button>
          <button class="seg" data-level="expired">仅已过期</button>
        </div>
      </div>
      <div id="reminderSummary" class="summary-chips"></div>
      <div id="reminderList" class="reminder-list"></div>
    </section>

    <!-- 续办记录 -->
    <section id="tab-renewals" class="tab-panel">
      <div class="panel-head">
        <h2>续办记录</h2>
        <button id="btnAddRenewal" class="btn primary">＋ 记一次续办</button>
      </div>
      <div class="table-wrap">
        <table id="renewalsTable">
          <thead>
            <tr>
              <th>续办日期</th><th>关联证件</th><th>办理渠道</th><th>状态</th>
              <th>费用</th><th>备注</th><th class="th-actions">操作</th>
            </tr>
          </thead>
          <tbody id="renewalsTbody"></tbody>
        </table>
        <div id="renewalsEmpty" class="empty hidden">还没有续办记录，点右上角「记一次续办」</div>
      </div>
    </section>

    <!-- 分类统计 -->
    <section id="tab-stats" class="tab-panel">
      <div class="panel-head"><h2>分类统计</h2></div>
      <div id="statSummary" class="stat-summary"></div>
      <div id="statCards" class="stat-cards"></div>
      <div class="chart-wrap">
        <h3>各类型证件数量</h3>
        <div id="statChart" class="chart"></div>
      </div>
    </section>
  </main>

  <!-- 证件 新增/编辑 弹窗 -->
  <div id="docModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="docModalTitle">新增证件</h3>
        <button type="button" class="modal-close" data-close="docModal">✕</button>
      </div>
      <form id="docForm">
        <input type="hidden" id="docId" />
        <div class="form-grid">
          <label>证件类型
            <select id="docType">
              <option>身份证</option>
              <option>护照</option>
              <option>驾照</option>
              <option>会员卡</option>
              <option>保险</option>
            </select>
          </label>
          <label>证件名称 <input id="docName" required placeholder="如：张伟的因私护照" /></label>
          <label>持有人 <input id="docHolder" required placeholder="如：张伟" /></label>
          <label>证件号码 <input id="docNumber" placeholder="选填" /></label>
          <label>签发日期 <input id="docIssueDate" type="date" /></label>
          <label>到期日期 <input id="docExpiryDate" type="date" required /></label>
        </div>
        <label class="label-block">备注 <textarea id="docNotes" rows="2" placeholder="选填"></textarea></label>
        <div class="modal-foot">
          <button type="button" class="btn" data-close="docModal">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 续办 新增/编辑 弹窗 -->
  <div id="renewalModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="renewalModalTitle">记一次续办</h3>
        <button type="button" class="modal-close" data-close="renewalModal">✕</button>
      </div>
      <form id="renewalForm">
        <input type="hidden" id="renewalId" />
        <div class="form-grid">
          <label>关联证件 <select id="renewalDoc" required></select></label>
          <label>续办日期 <input id="renewalDate" type="date" required /></label>
          <label>办理状态
            <select id="renewalStatus">
              <option>计划中</option>
              <option>办理中</option>
              <option>已完成</option>
            </select>
          </label>
          <label>费用（元） <input id="renewalFee" type="number" min="0" step="0.01" placeholder="0" /></label>
        </div>
        <label class="label-block">办理渠道 <input id="renewalChannel" placeholder="如：交管12123 / 国家移民管理局政务平台 / 线下窗口" /></label>
        <label class="label-block">备注 <textarea id="renewalNote" rows="2" placeholder="选填"></textarea></label>
        <div class="modal-foot">
          <button type="button" class="btn" data-close="renewalModal">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/api.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
